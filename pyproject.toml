[project]
name = "swinglens"
version = "0.1.0"
description = "Extract per-frame physical state from a single-camera golf swing video using MediaPipe pose estimation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "mediapipe>=0.10.35,<0.11",
    "numpy>=2.4.6,<3",
    "opencv-python>=4.13.0.92,<5",
    "plotly>=7.1.0",
    "scipy>=1.17.1,<2",
]
